<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commande-Café Brulhé</title>
    <link rel="stylesheet" href="css/app.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <div class="container col-lg-8 col-12">
        <header>
            <a href="index.html"><img src="img/brulhe-logo.svg" alt="Logo"></a>
        </header>

        <main>
            <h2 class="mt-5">Étape 1 - Choix du breuvage</h2>

            <form action="options.html">
                <div class="mb-4 row">
                    <div class="col-2">
                        <label for="nom" class="col-form-label">Nom :</label>
                    </div>
                    <div class="col">
                        <input type="text" id="nom" class="form-control" placeholder="Nom complet" required>
                    </div>
                    <div class="invalid-feedback">Le nom est obligatoire.</div>
                </div>

                <div class="mb-4 row">
                    <div class="col-2">
                        <label for="breuvage" class="col-form-label">Breuvage :</label>
                    </div>
                    <div class="col">
                        <select class="form-select" aria-label="Default select example" id="breuvage" required>
                            <option value="1">Café moulu</option>
                            <option value="2">Expresso</option>
                            <option value="3">Cappuccino</option>
                        </select>
                    </div>

                </div>

                <div class="mb-3 row">
                    <div class="mt-3 col-2">
                        <label for="range1" class="form-label">Format :</label>
                    </div>
                    <div class="mt-3 col">
                        <input type="range" class="form-range" min="0" max="2" value="1" id="range1">

                        <div class="range-steps">
                            <span>Petit</span><span>Moyen</span><span>Grand</span>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-outline-primary  col-sm-12 col-md-2 col-lg-1">Suivant</button>
            </form>
        </main>
    </div>
</body>

</html>
